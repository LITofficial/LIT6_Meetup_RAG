
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
      - .env.develope.local
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEMO_DOCUMENT_DIR=/app/document

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - frontend-vite-cache:/app/node_modules/.vite
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  frontend-vite-cache:
